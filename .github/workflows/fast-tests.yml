name: Fast Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.75.0
        with:
          components: clippy

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.14.0

      - name: Install dependencies
        run: npm ci

      - name: Run fast JavaScript tests
        env:
          PYTHON: python
        run: npm test

      - name: Test Rust API
        run: cargo test --locked

      - name: Lint Rust API
        run: cargo clippy --locked --all-targets -- -D warnings
