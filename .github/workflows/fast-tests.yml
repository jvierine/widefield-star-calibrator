name: Fast Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.14.0

      - name: Install dependencies
        run: npm ci

      - name: Run fast JavaScript tests
        env:
          PYTHON: python
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test Rust workspace
        run: cargo test --locked --workspace

      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build native Rust CLI
        run: cargo build --locked --release -p wisc-cli

      - name: Install WebAssembly binding generator
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Build Rust/WASM WebGL application
        run: scripts/build_web.sh
